name: Siteyi yayinla ve bildir

# index.html (veya simgeler) değişince Sipariş Takibi sitesini yayınlar,
# sayfaya sürüm damgası basar, surum.json yazar ve açık programlara
# canlı kanaldan tek "surum" mesajı gönderir (Teklif'teki "Şimdi Güncelle" gibi).
# Kütüphaneler (Supabase, PDF, Excel) sabit sürümle npm'den doğrulanarak indirilir ve sitenin
# kendi lib/ klasöründen sunulur; dış CDN'e bağımlılık yoktur. İndirilemezse yayın durur, eski site kalır.
# Windows .exe iş akışına (pronto-windows-release.yml) dokunmaz.
on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.webmanifest', '*.png', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    env:
      SB_URL: ${{ secrets.SUPABASE_URL }}
      SB_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Yayin klasoru + surum damgasi
        run: |
          mkdir _site
          cp index.html _site/
          for f in manifest.webmanifest apple-touch-icon.png ikon-64.png ikon-192.png ikon-512.png ikon-maskable-512.png; do if [ -f "$f" ]; then cp "$f" _site/; fi; done
          V=$(sha256sum index.html | cut -c1-7)
          echo "V=$V" >> "$GITHUB_ENV"
          sed -i "s/const V41_SURUM = '__SURUM__'/const V41_SURUM = '$V'/" _site/index.html
          grep -q "const V41_SURUM = '$V'" _site/index.html
          printf '{"v":"%s"}\n' "$V" > _site/surum.json
          touch _site/.nojekyll

      - name: Kutuphaneler (sabit surum, npm butunluk kontrolu)
        run: |
          set -euo pipefail
          mkdir -p _site/lib
          K=$(mktemp -d); H="$PWD"
          # al <paket@surum veya resmi tgz adresi> <paket icindeki dosya> <yayin adi>
          # npm pack, indirilen paketi kayit defterindeki butunluk ozetiyle (sha512) dogrular; surumler sabittir.
          al() {
            rm -rf "$K"/*
            npm pack "$1" --pack-destination "$K" --loglevel=warn > /dev/null
            tar xzf "$K"/*.tgz -C "$K"
            kaynak="$K/package/$2"
            # bazı paketlerde yalnız sıkıştırılmamış sürüm var (x.min.js yoksa x.js)
            [ -f "$kaynak" ] || kaynak="$K/package/${2%.min.js}.js"
            if [ ! -f "$kaynak" ]; then
              echo "BULUNAMADI: $1 içinde $2 — paketteki .js dosyaları:"; (cd "$K/package" && find . -name '*.js' -path '*dist*' | head -40); exit 1
            fi
            cp "$kaynak" "$H/_site/lib/$3"
            echo "$3 <- $1  sha256:$(sha256sum "$H/_site/lib/$3" | cut -c1-16)"
          }
          al @supabase/supabase-js@2.117.2 dist/umd/supabase.min.js supabase.min.js
          al html2canvas@1.4.1 dist/html2canvas.min.js html2canvas.min.js
          al jspdf@2.5.2 dist/jspdf.umd.min.js jspdf.umd.min.js
          al pdfmake@0.2.10 build/pdfmake.min.js pdfmake.min.js
          al pdfmake@0.2.10 build/vfs_fonts.js vfs_fonts.js
          al https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz dist/xlsx.full.min.js xlsx.full.min.js
          grep -q '0\.20\.3' _site/lib/xlsx.full.min.js
          ls -la _site/lib

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4

      - name: Acik programlara bildirim
        if: ${{ env.SB_URL != '' && env.SB_KEY != '' }}
        run: |
          H=(-H "apikey: $SB_KEY" -H "Content-Type: application/json")
          [[ "$SB_KEY" == eyJ* ]] && H+=(-H "Authorization: Bearer $SB_KEY")
          MSG=$(jq -nc --arg v "$V" '{messages:[{topic:"pronto-siparis",event:"surum",private:true,payload:{v:$v}}]}')
          # yayın CDN'e yayılsın diye kısa bekleme; sonra tek mesaj
          sleep 20
          curl -sSf "${H[@]}" "$SB_URL/realtime/v1/api/broadcast" -d "$MSG"
          echo "Bildirim gonderildi: $V"
