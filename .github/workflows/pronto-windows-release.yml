name: PRONTO Windows Release

on:
  push:
    paths:
      - 'PRONTO_DESKTOP/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronto-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy current PRONTO web application
        shell: pwsh
        run: Copy-Item -Force .\index.html .\PRONTO_DESKTOP\index.html

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: PRONTO_DESKTOP/package.json

      - name: Set automatic release version
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd PRONTO_DESKTOP

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $parts = ([string]$package.version).Split('.')

          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]($parts[2] -replace '[^0-9].*$', '')

          try {
            $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest" `
              -Headers $headers `
              -Method Get

            if ($release.tag_name -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3] + 1
            }
            else {
              $patch++
            }
          }
          catch {
            $patch++
          }

          $version = "$major.$minor.$patch"

          $package.version = $version

          $package |
            ConvertTo-Json -Depth 20 |
            Set-Content package.json -Encoding UTF8

          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8

          Write-Host "Yeni PRONTO sürümü: $version"

      - name: Install dependencies
        working-directory: PRONTO_DESKTOP
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        working-directory: PRONTO_DESKTOP
        run: npm run dist -- --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: PRONTO v${{ env.RELEASE_VERSION }}
          target_commitish: main
          generate_release_notes: true
          files: |
            PRONTO_DESKTOP/dist/*.exe
            PRONTO_DESKTOP/dist/*.blockmap
            PRONTO_DESKTOP/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
